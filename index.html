<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Z Console is a free, local-first RPG practice interface for movement, reflection, and deliberate practice.">
  <title>Z Console</title>
  <style>
    :root {
      --bg: #06100e;
      --panel: #10241e;
      --line: #31765d;
      --green: #72ffaf;
      --lime: #d0ff68;
      --yellow: #ffe878;
      --orange: #ff9f55;
      --red: #ff6870;
      --purple: #c5a0ff;
      --blue: #79bdff;
      --text: #effff6;
      --muted: #a8c9b7;
      --dark: #06130f;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: radial-gradient(circle at 50% -5%, #26624688, transparent 34%), linear-gradient(145deg, #030706, #092019 55%, #040908);
    }
    button, input, select { font: inherit; }
    .app { width: min(1120px, calc(100% - 28px)); margin: auto; padding: 24px 0 42px; }
    .head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; margin-bottom: 16px; }
    .eyebrow { margin: 0 0 6px; color: var(--lime); font-size: .72rem; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(1.8rem, 5vw, 3rem); line-height: 1; }
    .sub { max-width: 720px; margin: 10px 0 0; color: var(--muted); line-height: 1.5; }
    .badge, .tag { border: 1px solid var(--line); border-radius: 999px; padding: 7px 10px; color: var(--green); font-size: .75rem; font-weight: 900; background: #071711; }
    .badge { white-space: nowrap; margin-top: 2px; }
    .grid { display: grid; grid-template-columns: 1.18fr .82fr; gap: 16px; }
    .panel { padding: 18px; border: 1px solid var(--line); border-radius: 18px; background: linear-gradient(180deg, #14382edd, #092019ee); box-shadow: 0 0 22px #5cffaa20; }
    .panel h2 { margin: 0; font-size: .95rem; letter-spacing: .09em; text-transform: uppercase; }
    .console { margin-top: 14px; padding: 16px; position: relative; overflow: hidden; border: 1px solid #72ffafaa; border-radius: 15px; background: repeating-linear-gradient(0deg, #72ffaf10 0 1px, transparent 1px 4px), var(--dark); }
    .console::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, #72ffaf22, transparent); transform: translateX(-100%); animation: scan 3.6s linear infinite; pointer-events: none; }
    @keyframes scan { to { transform: translateX(100%); } }
    .label { font-size: .7rem; color: var(--lime); font-weight: 900; letter-spacing: .12em; }
    .power { font: bold clamp(3.8rem, 10vw, 6.5rem) "Courier New", monospace; letter-spacing: -.1em; line-height: .95; color: var(--green); text-shadow: 0 0 16px #72ffaf80; }
    .rank { margin-top: 8px; color: var(--yellow); font-weight: 900; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-top: 14px; }
    .mini { padding: 9px; border: 1px solid #72ffaf3d; border-radius: 11px; background: #72ffaf0c; }
    .mini span { display: block; color: var(--muted); font-size: .64rem; font-weight: 800; text-transform: uppercase; }
    .mini strong { display: block; margin-top: 4px; font-size: 1.06rem; font-variant-numeric: tabular-nums; }
    .meterbox { margin-top: 15px; }
    .meterrow { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 6px; color: var(--muted); font-size: .76rem; font-weight: 800; }
    .meter { height: 11px; overflow: hidden; border: 1px solid var(--line); border-radius: 999px; background: var(--dark); }
    .fill { height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--green), var(--lime), var(--yellow)); transition: width .4s; }
    .controls { display: grid; gap: 13px; margin-top: 14px; }
    label { display: grid; gap: 6px; color: var(--muted); font-size: .82rem; font-weight: 800; }
    select { min-height: 44px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 11px; background: #071711; color: var(--text); }
    input[type=range] { width: 100%; accent-color: var(--lime); }
    .slider { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
    .pill { min-width: 78px; padding: 6px 8px; text-align: center; border: 1px solid var(--line); border-radius: 999px; color: var(--lime); font-size: .8rem; background: var(--dark); }
    .notice { padding: 10px; border: 1px solid #ffe87866; border-radius: 11px; color: #fff2bd; background: #ffe87812; font-size: .8rem; line-height: 1.45; }
    .notice.safe { border-color: #72ffaf70; color: #d9ffeb; background: #72ffaf10; }
    .notice.danger { border-color: #ff6870aa; color: #ffd7da; background: #ff687015; }
    .buttons { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 15px; }
    button { min-height: 46px; padding: 10px 13px; border: 0; border-radius: 11px; background: var(--lime); color: #06100b; font-weight: 900; cursor: pointer; }
    button.secondary { color: var(--text); border: 1px solid var(--line); background: #72ffaf12; }
    button.danger { color: #fff; border: 1px solid #ff6870aa; background: #ff687025; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .mission { min-height: 180px; margin-top: 14px; padding: 17px; border: 1px solid #ffe87875; border-radius: 15px; background: radial-gradient(circle at top right, #ffe87820, transparent 42%), #071711aa; }
    .type { font-size: .69rem; color: var(--yellow); letter-spacing: .14em; font-weight: 900; text-transform: uppercase; }
    .mission h3 { margin: 8px 0; font-size: 1.55rem; line-height: 1.08; }
    .mission p { margin: 0; color: var(--muted); line-height: 1.52; }
    .tags { display: flex; flex-wrap: wrap; gap: 7px; margin: 14px 0; }
    .tag.field { border-color: #c5a0ff90; color: #e9ddff; background: #c5a0ff1c; }
    .tag.time { border-color: #ffe87890; color: #fff1aa; background: #ffe87818; }
    .safety { margin-top: 13px !important; padding: 10px; border-left: 3px solid var(--orange); background: #ff9f5514; color: #ffe1c2 !important; font-size: .82rem; }
    .routine { display: grid; gap: 8px; margin-top: 14px; }
    .routine-block { display: grid; grid-template-columns: auto 1fr auto; gap: 9px; align-items: start; padding: 10px; border: 1px solid #72ffaf33; border-radius: 10px; background: #06130f99; }
    .routine-phase { color: var(--lime); font-size: .67rem; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; }
    .routine-title { color: var(--text); font-size: .84rem; font-weight: 800; }
    .routine-time { color: var(--yellow); font-family: "Courier New", monospace; font-size: .8rem; font-weight: 900; }
    .routine-description { grid-column: 2 / 4; color: var(--muted); font-size: .76rem; line-height: 1.42; }
    .timer-panel { margin-top: 14px; padding: 14px; border: 1px solid #72ffaf80; border-radius: 14px; background: repeating-linear-gradient(0deg, rgba(114,255,175,.05) 0 1px, transparent 1px 4px), #06130f; text-align: center; }
    .timer-panel.finished { border-color: #ffe878aa; }
    .timer-panel.paused { border-color: #79bdff99; }
    .timer-label { color: var(--lime); font-size: .69rem; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; }
    .mission-timer { margin: 7px 0 4px; color: var(--green); font: 900 clamp(2.7rem,10vw,4.6rem)/1 "Courier New", monospace; font-variant-numeric: tabular-nums; letter-spacing: -.06em; text-shadow: 0 0 16px #72ffaf80; }
    .timer-panel.finished .mission-timer { color: var(--yellow); text-shadow: 0 0 16px #ffe87880; }
    .timer-panel.paused .mission-timer { color: #b9dcff; text-shadow: 0 0 16px #79bdff80; }
    .timer-status { color: var(--muted); font-size: .8rem; line-height: 1.45; }
    .attributes { display: grid; gap: 11px; margin-top: 14px; }
    .attr { display: grid; grid-template-columns: 85px 1fr 30px; gap: 9px; align-items: center; color: var(--muted); font-size: .78rem; font-weight: 800; }
    .attr strong { text-align: right; color: var(--text); }
    .camera { border-color: #79bdff88; }
    .privacy { margin-top: 13px; padding: 11px; border: 1px solid #79bdff77; border-radius: 12px; color: #d9edff; background: #79bdff12; font-size: .8rem; line-height: 1.45; }
    .stage { min-height: 240px; display: grid; place-items: center; overflow: hidden; margin-top: 13px; border: 1px solid #79bdff77; border-radius: 14px; background: #06130f; }
    .stage video { display: none; width: 100%; max-height: 420px; object-fit: cover; background: #000; }
    .placeholder { padding: 20px; text-align: center; color: var(--muted); line-height: 1.5; }
    .status { margin-top: 10px; color: var(--muted); font-size: .78rem; line-height: 1.4; }
    .status.active { color: var(--green); }
    .log { grid-column: 1/-1; }
    .logs { display: grid; gap: 9px; margin-top: 14px; }
    .logitem { display: flex; justify-content: space-between; gap: 10px; padding: 11px; border: 1px solid #72ffaf30; border-radius: 11px; background: #0717119c; color: var(--muted); font-size: .8rem; }
    .logitem strong { color: var(--text); }
    .empty { padding: 14px; text-align: center; color: var(--muted); background: #0717119c; border-radius: 11px; }
    .learning-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 16px; margin-top: 16px; }
    .learning-panel p, .creative-note p { margin: 12px 0 0; color: var(--muted); font-size: .9rem; line-height: 1.55; }
    .learning-panel .notice { margin-top: 14px; }
    .shadow-panel { grid-column: 1/-1; border-color: rgba(197,160,255,.72); }
    .shadow-intro { margin: 12px 0 0; color: var(--muted); font-size: .86rem; line-height: 1.52; }
    .shadow-settings { display: grid; gap: 13px; margin-top: 14px; }
    .shadow-safety { margin-top: 14px; padding: 11px; border-left: 3px solid var(--orange); border-radius: 8px; background: #ff9f5514; color: #ffe1c2; font-size: .8rem; line-height: 1.48; }
    .shadow-arena { display: grid; min-height: 250px; place-items: center; margin-top: 14px; padding: 18px; border: 1px solid rgba(197,160,255,.68); border-radius: 15px; background: radial-gradient
